[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

[[edge_functions]]
  path = "/*"
  function = "share-preview"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
